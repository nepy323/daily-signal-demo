<script>
const D=JSON.parse(document.getElementById('signal-data').textContent);
const fmt=v=>+(+v).toFixed(2);
const num=v=>Number(v).toLocaleString();
function ticks(lo,hi,n){const raw=(hi-lo||1)/n,p=Math.pow(10,Math.floor(Math.log10(raw))),f=raw/p,step=(f<1.5?1:f<3?2:f<7?5:10)*p,o=[];for(let v=Math.ceil(lo/step)*step;v<=hi+1e-9;v+=step)o.push(+v.toFixed(4));return o}
function chart(bars){
 const W=360,H=210,padL=4,padR=38,top=14,vTop=148,vBot=186,pBot=140,N=bars.length,sig=N-1;
 let hi=Math.max(...bars.map(b=>b.h)),lo=Math.min(...bars.map(b=>b.l));const m=(hi-lo||1)*.04;hi+=m;lo-=m;
 const vm=Math.max(...bars.map(b=>b.v))||1,cw=(W-padL-padR)/N,xr=W-padR;
 const y=v=>top+(hi-v)/(hi-lo)*(pBot-top);
 let o=`<svg viewBox="0 0 ${W} ${H}">`;
 ticks(lo,hi,4).forEach(t=>{o+=`<line x1="${padL}" x2="${xr}" y1="${y(t)}" y2="${y(t)}" stroke="#ffffff1f" stroke-width=".5"/><text x="${xr+3}" y="${y(t)+2.5}" fill="#8b929c" font-size="8">${fmt(t)}</text>`});
 o+=`<rect x="${padL+sig*cw}" y="${top-6}" width="${cw}" height="${vBot-top+6}" fill="#ffffff18"/>`;
 bars.forEach((b,i)=>{const x=padL+i*cw+cw/2,c=b.c>=b.o?'#ff4d4f':'#2fbf71',t=y(Math.max(b.o,b.c)),bt=y(Math.min(b.o,b.c)),bw=Math.max(cw*.7,1);
  o+=`<line x1="${x}" x2="${x}" y1="${y(b.h)}" y2="${y(b.l)}" stroke="${c}" stroke-width=".7"/><rect x="${x-bw/2}" y="${t}" width="${bw}" height="${Math.max(bt-t,.7)}" fill="${c}"/>`;
  const vv=b.v/vm*(vBot-vTop);o+=`<rect x="${x-bw/2}" y="${vBot-vv}" width="${bw}" height="${vv}" fill="${c}" opacity=".8"/>`});
 for(let i=N-1;i>=0;i-=20){const x=padL+i*cw+cw/2;o+=`<line x1="${x}" x2="${x}" y1="${vBot}" y2="${vBot+3}" stroke="#8b929c" stroke-width=".5"/><text x="${Math.min(x,xr-10)}" y="${H-8}" fill="#8b929c" font-size="8" text-anchor="middle">${bars[i].d.slice(5)}</text>`}
 const sx=padL+sig*cw+cw/2;o+=`<path d="M${sx-3.5} ${pBot+7} L${sx+3.5} ${pBot+7} L${sx} ${pBot+1}Z" fill="#ffd54a"/>`;
 o+=`<text x="${xr+3}" y="${vTop+8}" fill="#8b929c" font-size="8">${num(vm)}</text><text x="${xr+3}" y="${vBot}" fill="#8b929c" font-size="8">0</text><text x="${xr+3}" y="${vTop-2}" fill="#8b929c" font-size="7">張</text>`;
 o+=`<text x="${padL+2}" y="9" fill="#8b929c" font-size="8">元</text><text x="${W-3}" y="${H-1}" fill="#8b929c" font-size="7" text-anchor="end">日K</text>`;
 return o+'</svg>'}
function peLine(p){return p?`本益比 <b>${fmt(p.value)}</b> 倍（${esc(p.as_of.slice(5))}）`:'本益比 <b>虧損／無資料</b>'}
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function marginLine(m){
 if(!m)return '融資 <b>無融資</b>';
 const r=m.avg_2w?(m.balance/m.avg_2w-1)*100:0,cls=r>0?'up':r<0?'dn':'fl';
 return `融資餘額 <b>${num(m.balance)}</b> 張（${esc(m.as_of.slice(5))}）<br>前兩週平均 <b>${num(Math.round(m.avg_2w))}</b> 張　<b class="${cls}">${r>0?'+':''}${r.toFixed(1)}%</b>`}
document.getElementById('hd').innerHTML=`今日訊號<small>${esc(D.date)} ${esc(D.cutoff_time)}　共 ${D.signals.length} 檔</small>`;
document.getElementById('grid').innerHTML=D.signals.length?D.signals.map(s=>{
