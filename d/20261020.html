<script>
const D=JSON.parse(document.getElementById('signal-data').textContent);
const fmt=v=>+(+v).toFixed(2);
function spark(bars){
 const W=160,H=132,N=bars.length,pad=3,sig=N-1,vh=26,ph=H-vh-6;
 const hi=fmt(Math.max(...bars.map(b=>b.h))),lo=fmt(Math.min(...bars.map(b=>b.l))),vm=Math.max(...bars.map(b=>b.v))||1;
 const cw=(W-pad*2)/N,y=v=>4+(hi-v)/(hi-lo||1)*(ph-8);
 let o=`<svg viewBox="0 0 ${W} ${H}">`;
 o+=`<rect x="${pad+sig*cw}" y="0" width="${cw}" height="${H}" fill="#ffffff18"/>`;
 bars.forEach((b,i)=>{const x=pad+i*cw+cw/2,up=b.c>=b.o,c=up?'#ff4d4f':'#2fbf71';
  const t=y(Math.max(b.o,b.c)),bt=y(Math.min(b.o,b.c));
  o+=`<line x1="${x}" x2="${x}" y1="${y(b.h)}" y2="${y(b.l)}" stroke="${c}" stroke-width=".8"/><rect x="${x-cw*.32}" y="${t}" width="${cw*.64}" height="${Math.max(bt-t,.8)}" fill="${c}"/>`;
  const vv=b.v/vm*vh;o+=`<rect x="${x-cw*.32}" y="${H-2-vv}" width="${cw*.64}" height="${vv}" fill="${c}" opacity=".8"/>`});
 const sx=pad+sig*cw+cw/2;o+=`<path d="M${sx-3} ${ph+3} L${sx+3} ${ph+3} L${sx} ${ph-1}Z" fill="#ffd54a"/>`;

 return o+'</svg>'}
